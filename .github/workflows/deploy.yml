name: Deploy to xCloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger xCloud deployment
        run: |
          curl -X POST "https://app.xcloud.host/api/git/N5RAGj9Qd82Zp73L0vE3zeYObmgXko0BM1yq/deploy" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 10
        continue-on-error: true