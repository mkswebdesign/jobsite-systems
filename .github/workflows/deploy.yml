name: Deploy to xCloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger xCloud deployment
        run: |
          curl -X POST "${{ secrets.XCLOUD_DEPLOY_URL }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 10
        continue-on-error: true
